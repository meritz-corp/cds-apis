syntax = "proto3";

package kdo_guard.v1.guard;

option go_package = "github.com/meritz-corp/cds-apis/go/kdo_guard/v1;kdo_guard";

// kdo-guard 운영용 API.
// inv_diff (재고 비교 앱) 가 임계값을 바꾸고 정지 이력을 조회하는 데 쓴다.
service GuardService {
  // 현재 감시 설정 조회
  rpc GetSettings(GetSettingsRequest) returns (Settings) {}

  // 임계값 변경. 다음 회차부터 적용된다.
  rpc UpdateSettings(UpdateSettingsRequest) returns (Settings) {}

  // 최근 정지 이력 (최신순)
  rpc ListStopEvents(ListStopEventsRequest) returns (ListStopEventsResponse) {}
}

message Settings {
  // 가용수량이 이 수량(주) 이상 어긋나면 위반
  int64 threshold_shares = 1;
  // 차이가 이 시간(초) 이상 유지되어야 정지시킨다
  uint32 stop_after_secs = 2;
  // 감시 주기 (초)
  uint64 interval_secs = 3;
  // 감시 중인 펀드
  repeated string funds = 4;
  // false 면 대사는 계속하되 StopSymbolFund 를 보내지 않는다
  bool enabled = 5;
  // 감시 가능한 KDO 인스턴스 이름 (서버 설정에 등록된 것)
  repeated string instances = 6;
  // 지금 감시 중인 KDO 인스턴스. 이 한 곳에만 요청한다.
  string active_instance = 7;
  // stop_after_secs 를 감시 주기로 환산한 연속 확인 횟수 (서버가 계산한 값)
  uint32 consecutive_checks = 8;
}

message GetSettingsRequest {}

message UpdateSettingsRequest {
  // 지정하면 임계값 변경. 1 이상이어야 한다.
  optional int64 threshold_shares = 1;
  // 지정하면 자동 정지 on/off 변경
  optional bool enabled = 2;
  // 지정하면 감시 대상 인스턴스 변경. instances 에 있는 이름이어야 한다.
  optional string active_instance = 3;
  // 비어 있지 않으면 감시 대상 펀드를 이 목록으로 교체한다.
  // 클라이언트가 지금 조회 중인 펀드만 정지 대상으로 두기 위한 것.
  repeated string funds = 4;
  // 지정하면 정지까지 필요한 지속 시간(초) 변경. 1 이상이어야 한다.
  optional uint32 stop_after_secs = 5;
}

message ListStopEventsRequest {
  // 기본 50, 최대 200
  uint32 limit = 1;
}

message ListStopEventsResponse {
  repeated StopEvent events = 1;
}

message StopEvent {
  // KDO 인스턴스 이름 (PROD, PROD2 …)
  string instance = 1;
  string fund = 2;
  // 종목 ISIN
  string symbol = 3;
  string name = 4;
  int64 kdo_sellable = 5;
  int64 ledger_sellable = 6;
  // StopSymbolFund 에 실어 보낸 사유
  string cause = 7;
  // RFC3339 (KST)
  string occurred_at = 8;
  // StopSymbolFund 호출 성공 여부
  bool succeeded = 9;
  // 실패 시 사유
  string error = 10;
  // 정지된 서비스 목록 ("mm(005930/0716)" …)
  repeated string stopped_services = 11;
}
