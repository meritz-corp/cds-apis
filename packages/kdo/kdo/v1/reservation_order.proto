syntax = "proto3";

package kdo.v1.reservation_order;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "kdo/v1/common.proto";

option go_package = "github.com/meritz-corp/cds-apis/go/kdo/v1;kdo";

// 예약주문 서비스.
// 08:30 이전에 FEP 로 송신하면 FEP 가 보관했다가 호가접수 개시(08:30)에 거래소로 내보낸다.
// 전략 공용(1차 사용처: ETF LP). 시가 직전(기본 08:59:30) 상대 1호가와 교차하는 예약주문은 취소되고,
// 인수 마감(기본 09:01:00)까지 소유 전략이 가동되지 않으면 남은 예약주문을 취소한다.
// 서버 종료 시 살아있는 예약주문은 전량 취소된다.
service ReservationOrderService {
  // 예약주문 송신 (송신 마감 이전에만). 일부만 송신되면 response.error 에 사유가 담긴다.
  rpc SubmitReservationOrders(SubmitReservationOrdersRequest) returns (SubmitReservationOrdersResponse) {
    option (google.api.http) = {
      post: "/v1/reservation-orders:submit"
      body: "*"
    };
  }

  // 예약주문 취소. order_ids 가 비면 소유 전략의 살아있는 예약주문 전부.
  rpc CancelReservationOrders(CancelReservationOrdersRequest) returns (CancelReservationOrdersResponse) {
    option (google.api.http) = {
      post: "/v1/reservation-orders:cancel"
      body: "*"
    };
  }

  // 영업일 예약주문 조회 (모든 서버). 시간표도 함께 내려준다.
  rpc ListReservationOrders(ListReservationOrdersRequest) returns (ListReservationOrdersResponse) {
    option (google.api.http) = {
      get: "/v1/reservation-orders"
    };
  }
}

// ETF LP 소유자.
message EtfLpReservationOwner {
  // "etfs/{symbol}"
  string etf = 1 [(google.api.field_behavior) = REQUIRED];
  // "funds/{fund_code}"
  string fund = 2 [(google.api.field_behavior) = REQUIRED];
}

// 예약주문을 내는 전략. 다른 전략(pair_v2 등)은 oneof 에 추가한다.
message ReservationOwner {
  oneof owner {
    EtfLpReservationOwner etf_lp = 1;
  }
}

// 운영자가 입력하는 예약주문 한 건.
message ReservationOrderSpec {
  // 종목. 비우면 소유자의 기본 종목 (ETF LP: 자기 ETF).
  string symbol = 1;
  kdo.v1.common.OrderSide side = 2;
  // 가격 (원)
  int64 price = 3;
  int64 quantity = 4;
}

message SubmitReservationOrdersRequest {
  ReservationOwner owner = 1 [(google.api.field_behavior) = REQUIRED];
  repeated ReservationOrderSpec orders = 2 [(google.api.field_behavior) = REQUIRED];
  // 체결 시 헷지 여부. 미지정이면 true.
  optional bool need_hedge = 3;
}

message SubmitReservationOrdersResponse {
  // 송신된 예약주문
  repeated ReservationOrder orders = 1;
  // 일부만 송신된 경우 실패 사유 (전부 송신 시 빈 문자열)
  string error = 2;
}

message CancelReservationOrdersRequest {
  ReservationOwner owner = 1 [(google.api.field_behavior) = REQUIRED];
  // 취소할 예약주문의 거래소 주문번호. 비면 소유 전략의 살아있는 예약주문 전부.
  repeated int64 order_ids = 2;
}

message CancelReservationOrdersResponse {
  // 취소를 송신한 건수 (확정은 거래소 응답)
  int32 cancel_sent_count = 1;
}

message ListReservationOrdersRequest {
  // 영업일 YYYY-MM-DD. 비면 오늘(KST).
  string business_date = 1;
  // 미지정이면 전체 소유자.
  ReservationOwner owner = 2;
}

// 예약주문 시간표 (KST HH:MM:SS)
message ReservationTimetable {
  // 이 시각 이전에만 송신 가능
  string submit_cutoff = 1;
  // 시가 직전 상대 1호가 교차 점검 시각
  string crossing_check_at = 2;
  // 소유 전략 인수 마감 시각
  string adopt_deadline = 3;
}

message ListReservationOrdersResponse {
  repeated ReservationOrder orders = 1;
  ReservationTimetable timetable = 2;
}

enum ReservationOrderStatus {
  RESERVATION_ORDER_STATUS_UNSPECIFIED = 0;
  // FEP 보관 중 (08:30 송출 전)
  RESERVATION_ORDER_STATUS_SUBMITTED = 1;
  // 거래소 접수
  RESERVATION_ORDER_STATUS_ACCEPTED = 2;
  RESERVATION_ORDER_STATUS_PARTIALLY_FILLED = 3;
  // 소유 전략이 인수 (이후 전략 호가로 관리)
  RESERVATION_ORDER_STATUS_ADOPTED = 4;
  RESERVATION_ORDER_STATUS_FILLED = 5;
  RESERVATION_ORDER_STATUS_CANCELLED = 6;
  RESERVATION_ORDER_STATUS_REJECTED = 7;
}

enum ReservationCancelReason {
  RESERVATION_CANCEL_REASON_UNSPECIFIED = 0;
  // 시가 직전 상대 1호가 교차 (시가에 바로 체결될 가격)
  RESERVATION_CANCEL_REASON_CROSSING = 1;
  // 인수 마감까지 소유 전략 미가동
  RESERVATION_CANCEL_REASON_ADOPT_DEADLINE = 2;
  // 서버 종료
  RESERVATION_CANCEL_REASON_SHUTDOWN = 3;
  // 재기동 전 프로세스가 낸 예약주문
  RESERVATION_CANCEL_REASON_PREVIOUS_PROCESS = 4;
  // 운영자 취소
  RESERVATION_CANCEL_REASON_OPERATOR = 5;
}

message ReservationOrder {
  int64 id = 1;
  // YYYY-MM-DD
  string business_date = 2;
  // 송신 서버
  string host = 3;
  ReservationOwner owner = 4;
  string symbol = 5;
  string fund_code = 6;
  kdo.v1.common.OrderSide side = 7;
  // 가격 (원)
  int64 price = 8;
  int64 quantity = 9;
  bool need_hedge = 10;
  // 거래소 주문번호
  int64 order_id = 11;
  int64 filled_quantity = 12;
  ReservationOrderStatus status = 13;
  // 공통 서비스가 요청한 취소 사유 (거래소·전략이 취소한 경우 UNSPECIFIED)
  ReservationCancelReason cancel_reason = 14;
  string reject_code = 15;
  string requested_by = 16;
  google.protobuf.Timestamp submitted_at = 17;
  google.protobuf.Timestamp accepted_at = 18;
  google.protobuf.Timestamp closed_at = 19;
}
