syntax = "proto3";

package kdo.v1.pair_v2;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/empty.proto";
import "google/api/resource.proto";
import "google/api/client.proto";
import "kdo/v1/hedge.proto";
import "kdo/v1/common.proto";

option go_package = "github.com/meritz-corp/cds-apis/go/kdo/v1;kdo";

// PairV2Service - 가격차(스프레드) 단일 트리거 페어 전략 관리 서비스 (V2)
//
// `kdo.v1.pair` 와 코드/스키마를 공유하지 않는 독립 패키지다 (lead_lag_v2/mm_v2 와 같은 포크 방식).
// 운영 중인 v1 PairService 를 보호하기 위한 의도적 격리이며, v1 메시지를 참조하지 않는다.
//
// v2 전략: base·counter 두 다리의 지정 호가로 스프레드를 재고, 목표치(target_spread)를
// 초과하면 그 가격 그대로 양다리를 동시에 발주한다. 미체결 잔량은 취소하지 않고
// auto_amend SelfQuote 가 추적 정정해 체결시킨다. v1 의 trigger×execution 2축 조합,
// 수량 불균형 트리거, settle/recovery/balance 사이클은 없다.
service PairV2Service {
  // 단일 PairV2 조회
  rpc GetPairV2(GetPairV2Request) returns (PairV2) {
    option (google.api.http) = {
      get: "/v1/{pair_v2=pair_v2s/*}"
    };
    option (google.api.method_signature) = "pair_v2";
  }

  // PairV2 목록 조회 (페이징 + 필터)
  rpc ListPairV2s(ListPairV2sRequest) returns (ListPairV2sResponse) {
    option (google.api.http) = {
      get: "/v1/pair_v2s"
    };
    option (google.api.method_signature) = "";
  }

  // PairV2 생성
  rpc CreatePairV2(CreatePairV2Request) returns (PairV2) {
    option (google.api.http) = {
      post: "/v1/pair_v2s"
      body: "pair_v2"
    };
    option (google.api.method_signature) = "pair_v2";
  }

  // PairV2 수정
  rpc UpdatePairV2(UpdatePairV2Request) returns (PairV2) {
    option (google.api.http) = {
      patch: "/v1/{pair_v2.name=pair_v2s/*}"
      body: "pair_v2"
    };
    option (google.api.method_signature) = "pair_v2,update_mask";
  }

  // PairV2 삭제
  rpc DeletePairV2(DeletePairV2Request) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/{pair_v2=pair_v2s/*}"
    };
    option (google.api.method_signature) = "pair_v2";
  }

  // PairV2 활성화 (status → ACTIVE, hot loop 시작)
  rpc ActivatePairV2(ActivatePairV2Request) returns (PairV2) {
    option (google.api.http) = {
      post: "/v1/{pair_v2=pair_v2s/*}:activate"
      body: "*"
    };
    option (google.api.method_signature) = "pair_v2";
  }

  // PairV2 일시 중지 (hot loop 중지, status → PAUSED)
  rpc PausePairV2(PausePairV2Request) returns (PairV2) {
    option (google.api.http) = {
      post: "/v1/{pair_v2=pair_v2s/*}:pause"
      body: "*"
    };
    option (google.api.method_signature) = "pair_v2";
  }

  // PairV2 실행 로그 목록 조회 (발사/스킵 시점 스냅샷, 페이징)
  rpc ListPairV2ExecutionLogs(ListPairV2ExecutionLogsRequest) returns (ListPairV2ExecutionLogsResponse) {
    option (google.api.http) = {
      get: "/v1/{pair_v2=pair_v2s/*}/executionLogs"
    };
    option (google.api.method_signature) = "pair_v2";
  }

  // PairV2 실시간 운영 단계(phase) 스트리밍 (변경 시마다 emit)
  rpc StreamPairV2Status(StreamPairV2StatusRequest) returns (stream PairV2StatusUpdate) {
    option (google.api.http) = {
      get: "/v1/{pair_v2=pair_v2s/*}:streamStatus"
    };
    option (google.api.method_signature) = "pair_v2";
  }

  // 수동 1회 발사 - 스프레드 조건/쿨다운/중지회차를 무시하고 즉시 양다리 1회 발사를 큐잉.
  // PAUSED 상태에서도 허용하며 자동발주를 켜지 않는다. 중복 대기 요청은 FAILED_PRECONDITION.
  // 시세 유효성(양다리 5초 이내), 연속매매, 수량 상한, 주문/잔고 검증은 유지한다.
  // 대기 요청은 5초 뒤 만료된다. accepted는 접수이고 결과는 실행로그/상태 스트림에서 확인한다.
  rpc LaunchPairV2Once(LaunchPairV2OnceRequest) returns (LaunchPairV2OnceResponse) {
    option (google.api.http) = {
      post: "/v1/{pair_v2=pair_v2s/*}:launchOnce"
      body: "*"
    };
  }

  // 미체결 잔량 전량 취소 - 이 페어 소유(PairV2Context) 주문만 취소. auto_amend 추적은 취소 확인과 함께 종료된다.
  rpc CancelPairV2Residual(CancelPairV2ResidualRequest) returns (CancelPairV2ResidualResponse) {
    option (google.api.http) = {
      post: "/v1/{pair_v2=pair_v2s/*}:cancelResidual"
      body: "*"
    };
  }

  // 미체결 잔량 정정 - 현재가 대비 ±amend_pct% 공격적 가격으로 일괄 정정 (mmm "미체결 1% 정정" 대응).
  // 정정된 주문은 auto_amend 자동 추적에서 해제된다 (운영자 수동 개입 시맨틱).
  rpc AmendPairV2ResidualPct(AmendPairV2ResidualPctRequest) returns (AmendPairV2ResidualPctResponse) {
    option (google.api.http) = {
      post: "/v1/{pair_v2=pair_v2s/*}:amendResidualPct"
      body: "*"
    };
  }

  // 이 페어의 주문별 추적 목록 (하단 주문 표). 최신순.
  rpc ListPairV2Orders(ListPairV2OrdersRequest) returns (ListPairV2OrdersResponse) {
    option (google.api.http) = {
      get: "/v1/{pair_v2=pair_v2s/*}/orders"
    };
  }

  // leg(base/counter)별 누적 집계 (상단 요약)
  rpc GetPairV2OrderSummary(GetPairV2OrderSummaryRequest) returns (GetPairV2OrderSummaryResponse) {
    option (google.api.http) = {
      get: "/v1/{pair_v2=pair_v2s/*}/orderSummary"
    };
  }

  // 명시적인 새 실행 시작 준비. PAUSED이고 미체결이 없을 때만 회차/누적 실행 상태 초기화.
  // 설정 수정, 일시정지, 재활성화는 실행 상태를 유지한다. 초기화 자체는 자동발주를 켜지 않는다.
  rpc ResetPairV2Session(ResetPairV2SessionRequest) returns (PairV2) {
    option (google.api.http) = {
      post: "/v1/{pair_v2=pair_v2s/*}:resetSession"
      body: "*"
    };
    option (google.api.method_signature) = "pair_v2";
  }
}

// ============================================================================
// PairV2 Entity
// ============================================================================

// PairV2 전략 — base·counter 지정 호가로 재는 스프레드가 target_spread 를 초과하면
// 그 가격 그대로 양다리를 동시 발주한다.
message PairV2 {
  option (google.api.resource) = {
    type: "kdo.cdsapis.xyz/PairV2"
    pattern: "pair_v2s/{pair_v2}"
  };

  // 리소스 이름 (pair_v2s/{id})
  string name = 1;

  // PairV2 ID
  int32 id = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // 전략 이름 (고유)
  string display_name = 3 [
    (google.api.field_behavior) = REQUIRED
  ];

  // Portfolio ID
  int32 portfolio_id = 4 [
    (google.api.field_behavior) = REQUIRED
  ];

  // Base 다리. side 가 매수차(BID)/매도차(ASK) 를 결정하고, quantity 가 1회 발주량.
  PairV2Entry base = 5 [
    (google.api.field_behavior) = REQUIRED
  ];

  // Counter 다리. quantity는 명시적인 1회 발주량으로 그대로 사용한다.
  PairV2Entry counter = 6 [
    (google.api.field_behavior) = REQUIRED
  ];

  // counter 가격을 base 가격축으로 옮기는 방법.
  PairV2SpreadType spread = 7 [
    (google.api.field_behavior) = REQUIRED
  ];

  // 진입 최소 스프레드. 현재 스프레드가 이 값을 "초과"할 때 발사. 단위 = base 가격 단위.
  // 캘린더 스프레드처럼 즉시 차익이 아닌 운용은 음수가 정상이다.
  double target_spread = 8;

  // 발사 후 재발사까지 대기 (ms)
  uint64 cooldown_ms = 9;

  // 미체결 잔량 추적 정정 임계 — auto_amend SelfQuote 의 opposite_qty_ratio_threshold.
  // base/counter 공유. 0 이면 절대 정정하지 않아 미체결이 영구히 남으므로 양수 필수.
  double amend_threshold = 10;

  // spread 가 NAV 일 때 필수인 NAV 환산 설정.
  PairV2Nav nav = 11;

  // base 다리 누적 상한 — 체결 + 미체결(inflight) 합산. 도달 시 신규 발사를 막는다.
  int64 max_base_quantity = 12;

  // 상태
  PairV2Status status = 13 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // 생성 시간
  google.protobuf.Timestamp create_time = 14 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // 수정 시간
  google.protobuf.Timestamp update_time = 15 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // 중지회차 - 이번 실행 세션의 발사 횟수가 이 값에 도달하면 자동 발사를 중지 (미설정 = 제한 없음).
  // 수동 발사도 횟수에 포함되지만 이 게이트는 무시한다. base 제출 성공 기준으로 센다.
  // 설정 변경/Pause/Activate 시 유지. ResetPairV2Session으로 초기화한다 (서버 프로세스 내 세션).
  optional uint32 pause_launch_no = 16;

  // 자동 발사 운영 시간창 시작 (KST "HH:MM:SS", 미설정 = 상시).
  // 시간창 밖에서는 자동 발사만 중지되고 수동 발사(LaunchPairV2Once)는 허용된다.
  // start > end 이면 자정을 넘기는 창으로 해석한다 (예: 18:00:00 ~ 02:00:00).
  optional string trading_window_start = 17;

  // 자동 발사 운영 시간창 종료 (KST "HH:MM:SS", 미설정 = 상시)
  optional string trading_window_end = 18;

  // 슬리피지 가드 - true 면 양다리의 발주 호가(BEST_TAKE=상대, BEST_MAKE=자기) 잔량이 발주수량 이상일 때만
  // 자동 발사한다 (잔량 부족 = 즉시 체결 불가/슬리피지 위험 → 발사 보류).
  // 수동 발사(LaunchPairV2Once)는 가드를 무시한다. 기본 false.
  bool slippage_guard = 19;

  // 일반 매도 가능 수량 부족 시 차입 재고 사용 허용. 기본 false.
  // 수동/자동 모두 적용하며, 체크와 예약은 동일 잔고 잠금 아래 수행한다.
  bool allow_borrowed_sell = 20;

  // 이전 회차 양다리 체결률의 최솟값 >= 설정값일 때 다음 자동 발사 허용.
  // 0..100, 미설정=제한 없음, 첫 회차=통과. 수동 발사는 무시한다.
  // 분모는 해당 회차 최초 발주수량. 정정은 중복 집계하지 않고 취소/거부는 체결로 세지 않는다.
  optional double min_fill_rate_pct = 21;
}

// ============================================================================
// Pair Entry
// ============================================================================

// 페어의 한쪽 엔트리 (단일 심볼 주문 스펙).
//
// v1 과 달리 base·counter 두 다리 모두 price_source 가 유효하다 — 스프레드를 그 가격으로
// 재고 그 가격으로 발주한다(측정가 = 발주가 불변식).
message PairV2Entry {
  // 종목 심볼
  string symbol = 1 [
    (google.api.field_behavior) = REQUIRED
  ];

  // 주문에 사용할 펀드 코드
  string fund_code = 2 [
    (google.api.field_behavior) = REQUIRED
  ];

  // 주문 방향 (base.side 가 스프레드 부호 규약의 기준)
  kdo.v1.common.OrderSide side = 3 [
    (google.api.field_behavior) = REQUIRED
  ];

  // 주문 수량. base/counter 모두 명시적인 1회 발주량.
  int64 quantity = 4 [
    (google.api.field_behavior) = REQUIRED
  ];

  // 호가 위치 — 스프레드 측정 기준이자 발주 가격. 미지정(UNSPECIFIED) 시 도메인 기본값
  // BEST_TAKE(상대호가, 즉시 체결 지향)로 처리된다.
  kdo.v1.common.RelativePriceSource price_source = 5;

  // 주문 tp_code (NONE=일반, LP=유동성공급자). 정정/취소는 거래소가 원주문 tp_code 를 따른다.
  kdo.v1.hedge.OrderTpCode tp_code = 6;
}

// ============================================================================
// Spread
// ============================================================================

// counter 가격을 base 가격축으로 옮기는 방법. 결과 스프레드의 단위는 항상 base 가격 단위.
message PairV2SpreadType {
  oneof kind {
    // counter 가격 × k 로 선형 환산. k=1 → 단순 가격차(원월−근월, KODEX200−TIGER200),
    // k≠1 → 이종 가격축(KODEX200 − K200선물×ETF배수). 선형이라 역방향(인버스)은 표현 불가.
    PairV2ScaledSpread scaled = 1;
    // PairV2.nav (NavKind) 로 counter → base 이론가 환산. 인버스·PDF 분해 등 비선형은 이쪽.
    PairV2NavSpread nav = 2;
  }
}

// counter 가격 × k 선형 환산 스프레드
message PairV2ScaledSpread {
  // k 는 양수 필수. counter.side != base.side 여야 한다(역방향은 Nav 사용).
  double k = 1;
}

// NAV 환산 스프레드 (PairV2.nav 설정 사용, 파라미터 없음)
message PairV2NavSpread {
}

// ============================================================================
// NAV
// ============================================================================

// ETF↔Future 페어의 NAV 환산 설정 — Pair 레벨 단일 공유. spread 가 NavSpread 일 때 base
// 목표가 산출에 사용한다. nav_kind 는 실제 EtfPricing/PricingContext 조립에 쓰는 파라미터
// 없는 태그다 (실 조립은 런w타임에 선물 + ETF 엔티티에서 수행).
message PairV2Nav {
  kdo.v1.common.EtfNavKind nav_kind = 1;
  // NAV 베이시스 (선물 가격축 단일값, 원)
  int64 basis = 2;
  // basis 를 정적값으로 고정할지(false) vs 시장 동기화 소스로부터 동적 추종할지(true).
  bool dynamic_basis = 3;
}

// ============================================================================
// Pair Status
// ============================================================================

// PairV2 상태
enum PairV2Status {
  PAIR_V2_STATUS_UNSPECIFIED = 0;
  // 운영 중 (hot loop 동작)
  PAIR_V2_STATUS_ACTIVE = 1;
  // 일시 중지
  PAIR_V2_STATUS_PAUSED = 2;
  // 보관 (더 이상 사용 안 함)
  PAIR_V2_STATUS_ARCHIVED = 3;
}

// PairV2 운영 단계 — 외부(운영자/UI)에 노출되는 실시간 lifecycle.
//
// v2 는 사이클 상태머신이 없다. 미체결 잔량은 취소하지 않고 auto_amend SelfQuote 가
// 추적하므로, 단계는 "발사 대기 / 추적 중 / 정지" 세 가지뿐이다.
enum PairV2RuntimePhase {
  PAIR_V2_RUNTIME_PHASE_UNSPECIFIED = 0;
  // 시세 수신 + 스프레드 평가 중, 미체결 주문 없음.
  PAIR_V2_RUNTIME_PHASE_IDLE = 1;
  // 미체결 잔량이 남아 auto_amend 가 추적 정정 중.
  PAIR_V2_RUNTIME_PHASE_TRACKING = 2;
  // 일시 중지.
  PAIR_V2_RUNTIME_PHASE_PAUSED = 3;
}

// ============================================================================
// Request / Response Messages — CRUD
// ============================================================================

message GetPairV2Request {
  // 리소스 이름 (pair_v2s/{id})
  string pair_v2 = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "kdo.cdsapis.xyz/PairV2"
    }
  ];
}

message ListPairV2sRequest {
  // 페이지 크기 (optional)
  optional int32 page_size = 1;

  // 페이지 토큰 (optional, for pagination)
  optional string page_token = 2;

  // 필터링 조건 (optional, AIP-160)
  //
  // Available Fields:
  // * status - 상태 (ACTIVE / PAUSED / ARCHIVED)
  // * portfolio_id - Portfolio ID
  //
  // Examples:
  // * status=ACTIVE
  // * portfolio_id=1
  string filter = 3 [
    (google.api.field_behavior) = OPTIONAL
  ];
}

message ListPairV2sResponse {
  // PairV2 목록
  repeated PairV2 pair_v2s = 1;

  // 다음 페이지 토큰
  string next_page_token = 2;
}

message CreatePairV2Request {
  // 생성할 PairV2
  PairV2 pair_v2 = 1 [
    (google.api.field_behavior) = REQUIRED
  ];
}

message UpdatePairV2Request {
  // 수정할 PairV2
  PairV2 pair_v2 = 1 [
    (google.api.field_behavior) = REQUIRED
  ];

  // 수정할 필드 마스크. 비어 있으면(unset) 전체 교체 — 기존 동작과 동일(하위호환).
  google.protobuf.FieldMask update_mask = 2;
}

message DeletePairV2Request {
  // 리소스 이름 (pair_v2s/{id})
  string pair_v2 = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "kdo.cdsapis.xyz/PairV2"
    }
  ];
}

// ============================================================================
// Request / Response Messages — Lifecycle
// ============================================================================

message ActivatePairV2Request {
  // 리소스 이름 (pair_v2s/{id})
  string pair_v2 = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "kdo.cdsapis.xyz/PairV2"
    }
  ];
}

message PausePairV2Request {
  // 리소스 이름 (pair_v2s/{id})
  string pair_v2 = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "kdo.cdsapis.xyz/PairV2"
    }
  ];
}

// ============================================================================
// PairV2 Execution Log (발주 시점 스냅샷 전용)
// ============================================================================

// 페어 실행 로그 레코드 — 발주(또는 스킵) 시점 스냅샷.
//
// 체결·슬리피지 필드는 없다. v2 는 미체결을 취소하지 않고 auto_amend 가 추적하므로
// 한 번의 발사가 여러 시점에 나눠 체결되고, 발사↔체결 1:1 매칭 자체가 성립하지 않는다.
// 체결 내역은 전 서비스 공통 SoT 인 order_log 에서 order_id lineage 로 조인한다.
message PairV2ExecutionLog {
  // Pair ID
  int32 pair_id = 1;

  // 실행 결과
  PairV2ExecutionOutcome outcome = 2;

  // 발사 판정에 쓴 측정 스프레드 (base 가격 단위)
  double spread = 3;

  // 그 시점의 목표 스프레드 (설정 변경 이력 추적용)
  double target_spread = 4;

  // Base 측 주문 ID (발주 성공 시)
  optional uint64 base_order_id = 5;

  // Counter 측 주문 ID (발주 성공 시)
  optional uint64 counter_order_id = 6;

  // base 발주가 = 스프레드 측정에 쓴 그 가격 (원, raw int64)
  int64 base_price = 7;

  // counter 발주가 = 스프레드 측정에 쓴 그 가격 (원, raw int64)
  int64 counter_price = 8;

  // base 발주 수량
  int64 base_qty = 9;

  // counter 발주 수량
  int64 counter_qty = 10;

  // 트리거 시세 수신 시점부터 base 제출 직후까지 경과 (us). 미발주 0.
  int64 trigger_to_base_submit_us = 11;

  // 트리거 시세 수신 시점부터 counter 제출 직후까지 경과 (us). 미발주 0.
  int64 trigger_to_counter_submit_us = 12;

  // 발주 시각
  google.protobuf.Timestamp dispatched_at = 13;

  // 상세 내용 (오류 메시지 등, optional)
  optional string detail = 14;
}

// 페어 실행 결과
enum PairV2ExecutionOutcome {
  PAIR_V2_EXECUTION_OUTCOME_UNSPECIFIED = 0;
  // 양 다리 모두 제출 성공
  PAIR_V2_EXECUTION_OUTCOME_SUBMITTED = 1;
  // 쿨다운 미충족
  PAIR_V2_EXECUTION_OUTCOME_SKIPPED_COOLDOWN = 2;
  // base 누적(체결+미체결)이 max_base_quantity 도달
  PAIR_V2_EXECUTION_OUTCOME_SKIPPED_MAX_QUANTITY = 3;
  // 한쪽 호가 미형성 등으로 스프레드 산출 불가
  PAIR_V2_EXECUTION_OUTCOME_SKIPPED_PRICE_UNAVAILABLE = 4;
  // 한 다리만 제출 성공 — 반대 다리 없이 노출이 남는다
  PAIR_V2_EXECUTION_OUTCOME_PARTIAL_FAILURE = 5;
  // 양 다리 모두 제출 실패
  PAIR_V2_EXECUTION_OUTCOME_FAILED = 6;
}

message ListPairV2ExecutionLogsRequest {
  // 리소스 이름 (pair_v2s/{id})
  string pair_v2 = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "kdo.cdsapis.xyz/PairV2"
    }
  ];

  // 페이지 크기 (기본: 50, 최대: 200)
  optional int32 page_size = 2;

  // 페이지 토큰 — 최신순(id DESC) 키셋 커서. 이전 응답의 next_page_token 을 그대로 전달.
  // 최초 조회는 미지정.
  optional string page_token = 3;

  // outcome 필터 (UNSPECIFIED = 전체)
  PairV2ExecutionOutcome outcome = 4;

  // 발주 시각 범위 시작 (inclusive). 미지정 시 하한 없음.
  optional google.protobuf.Timestamp dispatched_from = 5;

  // 발주 시각 범위 끝 (exclusive). 미지정 시 상한 없음.
  optional google.protobuf.Timestamp dispatched_to = 6;
}

message ListPairV2ExecutionLogsResponse {
  // 실행 로그 목록
  repeated PairV2ExecutionLog execution_logs = 1;

  // 다음 페이지 토큰 (더 없으면 빈 문자열)
  string next_page_token = 2;

  // 필터 조건(outcome/dispatched_from/dispatched_to) 기준 전체 건수 (cursor 무관)
  int32 total_count = 3;
}

// ============================================================================
// Real-time Status Streaming
// ============================================================================

// StreamPairV2Status 요청
message StreamPairV2StatusRequest {
  // 리소스 이름 (pair_v2s/{id})
  string pair_v2 = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "kdo.cdsapis.xyz/PairV2"
    }
  ];
}

// ============================================================================
// Request / Response Messages — Manual Operations
// ============================================================================

message LaunchPairV2OnceRequest {
  // 리소스 이름 (pair_v2s/{id})
  string pair_v2 = 1 [
    (google.api.field_behavior) = REQUIRED
  ];
}

message LaunchPairV2OnceResponse {
  // 발사 큐잉 성공 여부 (실제 발주는 핫루프 다음 tick 에서 실행)
  bool accepted = 1;

  // 거부 사유 (accepted=false 일 때)
  string reason = 2;
}

message ResetPairV2SessionRequest {
  string pair_v2 = 1 [(google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { type: "kdo.cdsapis.xyz/PairV2" }];
}

message CancelPairV2ResidualRequest {
  // 리소스 이름 (pair_v2s/{id})
  string pair_v2 = 1 [
    (google.api.field_behavior) = REQUIRED
  ];
}

message CancelPairV2ResidualResponse {
  // 취소 요청된 원주문 ID 목록
  repeated uint64 cancelled_order_ids = 1;

  // 취소 실패 항목 (주문ID: 사유)
  repeated PairV2ResidualError errors = 2;
}

message AmendPairV2ResidualPctRequest {
  // 리소스 이름 (pair_v2s/{id})
  string pair_v2 = 1 [
    (google.api.field_behavior) = REQUIRED
  ];

  // 정정 폭 % (예: 1.0 = 현재가 대비 1%). 0 < amend_pct <= 30.
  // 매도 주문은 현재가×(1-pct/100), 매수 주문은 ×(1+pct/100) 방향. 기존 주문가보다 공격적일 때만 정정.
  double amend_pct = 2 [
    (google.api.field_behavior) = REQUIRED
  ];
}

// 정정된 주문
message PairV2AmendedOrder {
  // 원주문 ID
  uint64 original_order_id = 1;

  // 정정 주문 ID
  uint64 amend_order_id = 2;

  // 정정 후 가격
  string price = 3;
}

message AmendPairV2ResidualPctResponse {
  // 정정된 주문 목록
  repeated PairV2AmendedOrder amended_orders = 1;

  // 정정 실패/스킵 항목
  repeated PairV2ResidualError errors = 2;
}

// 잔량 개입(취소/정정) 실패 항목
message PairV2ResidualError {
  // 대상 주문 ID
  uint64 order_id = 1;

  // 사유
  string reason = 2;
}

// StreamPairV2Status 스트리밍 응답 — 운영 단계 변경 시마다 emit
message PairV2StatusUpdate {
  // 리소스 이름 (pair_v2s/{id})
  string pair_v2 = 1;

  // 현재 운영 단계
  PairV2RuntimePhase phase = 2;

  // 스냅샷 시각
  google.protobuf.Timestamp updated_at = 3;

  // 실행 세션의 누적 발사 횟수 (설정 변경/Pause/Activate 시 유지)
  uint32 launch_count = 4;

  // 최근 측정 스프레드 (base 가격 단위, 약 1초 주기 스로틀 — mmm 화면 "시장가격" 대응).
  // 시세 미수신 구간에는 실리지 않는다.
  optional double current_spread = 5;

  // base 다리의 발주 방향 상대호가 1호가 잔량 (측정 시점, ~1초 주기 — 슬리피지 가드 판단 근거 표시용)
  optional int64 base_top_quantity = 6;

  // counter 다리의 발주 방향 상대호가 1호가 잔량
  optional int64 counter_top_quantity = 7;

  // 현재 자동 발사를 막는 주된 사유. 여러 조건 미충족 시 서버 판정 우선순위의 첫 사유.
  PairV2BlockReason block_reason = 8;
  // 이전 회차 양다리 체결률 중 작은 값. 발사 이력이 없으면 미설정.
  optional double previous_fill_rate_pct = 9;
  bool manual_launch_pending = 10;
  // 최근 발사 요청 오류. 다음 발주 성공/세션 초기화 시 해제.
  optional string last_launch_error = 11;
}

enum PairV2BlockReason {
  PAIR_V2_BLOCK_REASON_UNSPECIFIED = 0;
  PAIR_V2_BLOCK_REASON_NONE = 1;
  PAIR_V2_BLOCK_REASON_PAUSED = 2;
  PAIR_V2_BLOCK_REASON_PRICE_UNAVAILABLE = 3;
  PAIR_V2_BLOCK_REASON_STALE_QUOTE = 4;
  PAIR_V2_BLOCK_REASON_NON_CONTINUOUS_SESSION = 5;
  PAIR_V2_BLOCK_REASON_SPREAD = 6;
  PAIR_V2_BLOCK_REASON_COOLDOWN = 7;
  PAIR_V2_BLOCK_REASON_TRADING_WINDOW = 8;
  PAIR_V2_BLOCK_REASON_LAUNCH_LIMIT = 9;
  PAIR_V2_BLOCK_REASON_FILL_RATE = 10;
  PAIR_V2_BLOCK_REASON_SLIPPAGE = 11;
  PAIR_V2_BLOCK_REASON_QUANTITY_LIMIT = 12;
  PAIR_V2_BLOCK_REASON_ORDER_VALIDATION = 13;
  PAIR_V2_BLOCK_REASON_PARTIAL_FAILURE = 14;
  PAIR_V2_BLOCK_REASON_RUNTIME_ERROR = 15;
}

// ============================================================================
// Order Tracking & Summary
// ============================================================================

// 페어의 두 다리 식별자 (base / counter)
enum PairV2Slot {
  PAIR_V2_SLOT_UNSPECIFIED = 0;
  PAIR_V2_SLOT_BASE = 1;
  PAIR_V2_SLOT_COUNTER = 2;
}

// 주문 단위 상태
enum PairV2OrderStatus {
  PAIR_V2_ORDER_STATUS_UNSPECIFIED = 0;
  // 발주 요청 (접수 대기)
  PAIR_V2_ORDER_STATUS_SUBMITTED = 1;
  // 거래소 접수
  PAIR_V2_ORDER_STATUS_RECEIVED = 2;
  PAIR_V2_ORDER_STATUS_PARTIALLY_FILLED = 3;
  PAIR_V2_ORDER_STATUS_FILLED = 4;
  // 정정으로 대체됨
  PAIR_V2_ORDER_STATUS_AMENDED = 5;
  PAIR_V2_ORDER_STATUS_CANCELLED = 6;
  PAIR_V2_ORDER_STATUS_REJECTED = 7;
}

// 페어 주문 추적 행
message PairV2Order {
  int32 pair_id = 1;
  // 다리 구분 (BASE / COUNTER)
  PairV2Slot slot = 2;
  // 발사 사이클 식별자
  uint32 cycle_id = 3;
  uint64 order_id = 4;
  // 정정/취소인 경우 원주문
  optional uint64 original_order_id = 5;
  string symbol = 6;
  kdo.v1.common.OrderSide side = 7;
  string order_price = 8;
  int64 order_quantity = 9;
  int64 filled_quantity = 10;
  // 살아있는 상태에서만 >0
  int64 remaining_quantity = 11;
  // 체결 없으면 빈 문자열
  string average_fill_price = 12;
  PairV2OrderStatus status = 13;
  google.protobuf.Timestamp create_time = 14;
  google.protobuf.Timestamp update_time = 15;
}

message ListPairV2OrdersRequest {
  string pair_v2 = 1 [(google.api.field_behavior) = REQUIRED];
  optional int32 page_size = 2;
  optional string page_token = 3;
  // true 면 살아있는(접수/부분체결) 주문만
  bool live_only = 4;
}

message ListPairV2OrdersResponse {
  repeated PairV2Order orders = 1;
  string next_page_token = 2;
}

// leg별 누적 집계
message PairV2LegSummary {
  PairV2Slot slot = 1;
  string symbol = 2;
  // 누적 발주 수량
  int64 ordered_quantity = 3;
  // 누적 체결 수량
  int64 filled_quantity = 4;
  // 살아있는 미체결 합
  int64 remaining_quantity = 5;
  string average_fill_price = 6;
  // 체결금액 (원)
  int64 filled_amount = 7;
  // 참조 현재가 (조회 시점, 없으면 빈 문자열)
  string reference_price = 8;
  // 미체결 × 참조가
  int64 remaining_amount = 9;
}

message GetPairV2OrderSummaryRequest {
  string pair_v2 = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetPairV2OrderSummaryResponse {
  repeated PairV2LegSummary legs = 1;
  // 세션 발사 횟수 (실행 중 아니면 0)
  uint32 launch_count = 2;
}
