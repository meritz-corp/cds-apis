syntax = "proto3";

package kdo.v1.spread_capture;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/client.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "kdo/v1/common.proto";
import "kdo/v1/lp.proto";
import "kdo/v1/order_log.proto";

option go_package = "github.com/meritz-corp/cds-apis/go/kdo/v1;kdo";

// 스프레드 캡처 — 1틱 가치가 큰 ETF(곱버스류)에서 선물로 본 공정가가 틱 경계에서 멀면(안전 구간) 매수·매도 1호가부터
// depth 단씩 LP 호가를 깔아 스프레드를 먹고, 공정가가 경계에 임계만큼 다가오면(전환 구간) 그 경계 가격의 주문을 맨 뒤 단으로
// 정정하고, 경계까지 청산 시작 임계만 남으면 불리한 방향 노출(상승이면 매도 노출, 하락이면 매수 노출)을 경계 가격 지정가로
// 청산한다(남은 수량은 대기, 청산 정정 임계로 한 호가씩 정정).
// 대기열 우선순위를 위해 08:28 에 장전 설정가로 depth 단을 보내고(FEP 보관 → 08:30 접수), 시가 결정 직후 선물 기준 목표 오더북으로
// 1회 정렬한다. 같은 가격에 있는 주문은 건드리지 않는다. 15:19:00 에 전부 취소하고 남은 노출을 IOC 로 청산한 뒤 끝난다.
// (ETF, 펀드) 단위로 설정·start·stop 한다.
service SpreadCaptureService {
  // 스프레드 캡처 설정 조회
  rpc GetSpreadCapture(GetSpreadCaptureRequest) returns (SpreadCapture) {
    option (google.api.http) = {
      get: "/v1/spread_captures/{etf_symbol}/{fund_code}"
    };
    option (google.api.method_signature) = "etf_symbol,fund_code";
  }

  // 스프레드 캡처 설정 목록
  rpc ListSpreadCaptures(ListSpreadCapturesRequest) returns (ListSpreadCapturesResponse) {
    option (google.api.http) = {
      get: "/v1/spread_captures"
    };
    option (google.api.method_signature) = "";
  }

  // 스프레드 캡처 설정 저장 — 없으면 만들고 있으면 덮어쓴다. 실행 중이면 basis·adjustment·임계·되돌림 여유·청산 시작 임계·청산 정정 임계·최대 순노출만
  // 바꿀 수 있고 실행에 바로 반영된다. 실행 중에 그 밖의 값(장전 시작가·depth·수량·호가단위·pricing 종류)이 저장값과 다르면 FAILED_PRECONDITION.
  rpc UpdateSpreadCapture(UpdateSpreadCaptureRequest) returns (SpreadCapture) {
    option (google.api.http) = {
      post: "/v1/spread_captures/{spread_capture.etf_symbol}/{spread_capture.fund_code}"
      body: "*"
    };
    option (google.api.method_signature) = "spread_capture";
  }

  // 스프레드 캡처 설정 삭제 — 실행 중이면 FAILED_PRECONDITION.
  rpc DeleteSpreadCapture(DeleteSpreadCaptureRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/spread_captures/{etf_symbol}/{fund_code}"
    };
    option (google.api.method_signature) = "etf_symbol,fund_code";
  }

  // 스프레드 캡처 시작 — 08:28 전이면 08:28 에 장전 주문을 보내고, 08:28 ~ 시가 결정 전이면 바로 보낸다(08:30 이후분은 바로 동시호가 접수).
  // 시가 결정 뒤 시작하면 장전 주문 없이 선물 기준 목표 오더북을 바로 깐다. 15:19:00 이후이거나 이미 실행 중이면 FAILED_PRECONDITION.
  // 주문자 식별정보는 start 한 사람 기준.
  rpc StartSpreadCapture(StartSpreadCaptureRequest) returns (SpreadCaptureStatus) {
    option (google.api.http) = {
      post: "/v1/spread_captures/{etf_symbol}/{fund_code}:start"
      body: "*"
    };
  }

  // 스프레드 캡처 정지 — 살아 있는 주문을 전부 취소한다. 노출은 청산하지 않는다(상태의 net_quantity 참고).
  // 08:30 전 FEP 가 보관 중인 주문은 08:30 에 접수되는 대로 취소한다.
  rpc StopSpreadCapture(StopSpreadCaptureRequest) returns (SpreadCaptureStatus) {
    option (google.api.http) = {
      post: "/v1/spread_captures/{etf_symbol}/{fund_code}:stop"
      body: "*"
    };
  }

  // 오늘 시작한 스프레드 캡처 상태 목록
  rpc ListSpreadCaptureStatuses(ListSpreadCaptureStatusesRequest) returns (ListSpreadCaptureStatusesResponse) {
    option (google.api.http) = {
      get: "/v1/spread_captures/statuses"
    };
    option (google.api.method_signature) = "";
  }

  // 상태 스트림 — 상태·구간·주문·체결이 바뀌면 그 (ETF, 펀드)의 상태 전체를 보낸다. 실행 중엔 공정가 갱신을 위해 1초마다도 보낸다.
  rpc StreamSpreadCaptureStatuses(StreamSpreadCaptureStatusesRequest) returns (stream SpreadCaptureStatus) {
    option (google.api.http) = {
      get: "/v1/spread_captures/statuses:stream"
    };
    option (google.api.method_signature) = "";
  }

  // 포지션 사이클 목록 — 순노출이 0 에서 생겨(open) 다시 0 이 될 때(close)까지의 체결·청산 주문 경과와 그때 공정가. 최근에 저장된 것부터.
  // 사이클은 닫힐 때(또는 노출을 남긴 채 실행이 끝날 때) 저장된다. 이 서버에서 아직 열려 있는 사이클은 첫 페이지 맨 앞에 붙는다(page_size 밖).
  rpc ListSpreadCaptureCycles(ListSpreadCaptureCyclesRequest) returns (ListSpreadCaptureCyclesResponse) {
    option (google.api.http) = {
      get: "/v1/spread_captures/cycles"
    };
    option (google.api.method_signature) = "";
  }
}

// ========== Setting ==========

// 스프레드 캡처 설정 — (ETF, 펀드) 당 하나.
message SpreadCapture {
  string etf_symbol = 1 [(google.api.field_behavior) = REQUIRED];

  string fund_code = 2 [(google.api.field_behavior) = REQUIRED];

  // 장전(08:28) 매수 시작가(원). 0 이면 장전 매수 안 냄 — 시가 직후 정렬 때 목표 오더북대로 새로 낸다
  int64 bid_price = 3;

  // 장전(08:28) 매도 시작가(원). 0 이면 장전 매도 안 냄
  int64 ask_price = 4;

  // 측별 단수 (1~10) — 매수·매도 1호가부터 이만큼 깐다
  uint32 depth = 5;

  // 단별 수량 (매수·매도 공통)
  int64 quantity = 6;

  // ETF 호가단위(원) — 단 간격이자 틱 경계 간격
  int64 tick_size = 7;

  // 공정가 계산 방식 — 선물 하나로 계산하는 FUTURE_BASIS·LEVERAGE_FUTURE·INDEX_TRACKING_HEDGE·PDF_DECOMPOSE_HEDGE 만 허용.
  // PDF_DECOMPOSE_HEDGE 는 하위 ETF 까지 분해한 PDF 에 선물이 하나만 남아야 한다(start 때 확인 — 곱버스처럼 추적 선물이 마스터에 없는 ETF 용,
  // 선물 외 구성종목은 start 때 값으로 고정·basis 미적용). 공정가 = NAV(pricing·basis) + adjustment
  kdo.v1.common.EtfPricing pricing = 8;

  // 원
  double bid_basis = 9;

  // 원
  double ask_basis = 10;

  // 원
  double bid_adjustment = 11;

  // 원
  double ask_adjustment = 12;

  // 임계 (선물 틱, 소수 가능) — 공정가가 틱 경계까지 이만큼 남으면 전환 구간에 들어간다
  double threshold_ticks = 13;

  // 되돌림 여유 (선물 틱, 소수 가능) — 전환 구간에서 원래 안전 구간으로 돌아가려면 경계에서 임계 + 이만큼 멀어져야 한다
  double reentry_ticks = 14;

  // 15: 청산 슬리피지 — 삭제(항상 0). 전환 구간 청산은 경계 가격, 마감 청산 IOC 는 시장 상대 1호가에 낸다.
  reserved 15;
  reserved "flatten_slippage_ticks";

  // 청산 시작 임계 (선물 틱, 소수 가능) — 공정가가 틱 경계까지 이만큼 남으면 불리한 방향 노출 청산을 시작한다(경계 쪽 호가는 임계에서 먼저 비킨다).
  // 0 이상, 임계 이하. 없으면 임계와 같다(호가를 비킬 때 바로 청산)
  optional double flatten_start_ticks = 19;

  // 청산 정정 임계 (선물 틱, 소수 가능) — 전환 구간 청산은 경계 가격 지정가로 내고 남은 수량은 그 가격에 둔다.
  // 공정가가 그 경계를 이만큼 넘어가면(매도 청산은 아래로, 매수 청산은 위로) 한 호가단위 불리한 가격으로 정정한다.
  // 0 이상, 임계 + 이 값(원 환산)은 호가단위보다 작아야 한다
  double flatten_amend_ticks = 18;

  // 최대 순노출 (주) — 순노출이 이 이상이면 노출을 키우는 쪽의 빈 단을 다시 채우지 않는다
  int64 max_net_quantity = 16;

  google.protobuf.Timestamp update_time = 17 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// ========== Status ==========

// 스프레드 캡처 실행 상태
enum SpreadCaptureState {
  SPREAD_CAPTURE_STATE_UNSPECIFIED = 0;
  // start 됨 — 장전 송신 시각(08:28) 대기
  SPREAD_CAPTURE_STATE_WAITING = 1;
  // 장전 주문 송신 — 시가 결정 대기. 08:30 전이면 FEP 보관 중
  SPREAD_CAPTURE_STATE_SENT = 2;
  // 접속매매 — 목표 오더북 유지 중
  SPREAD_CAPTURE_STATE_RUNNING = 3;
  // 15:19:00 — 전부 취소하고 남은 노출을 IOC 로 청산하는 중
  SPREAD_CAPTURE_STATE_CLOSING = 4;
  // stop — 남은 주문 취소 확인 대기 (노출은 청산하지 않음)
  SPREAD_CAPTURE_STATE_STOPPING = 5;
  // 끝 — stop·마감·오류 (message 참고)
  SPREAD_CAPTURE_STATE_STOPPED = 6;
}

// 선물로 본 공정가의 구간
enum SpreadCaptureZone {
  // 공정가 준비 전
  SPREAD_CAPTURE_ZONE_UNSPECIFIED = 0;
  // 안전 구간 — 틱 경계에서 임계 넘게 떨어짐. 매수·매도 1호가부터 깐다
  SPREAD_CAPTURE_ZONE_SAFE = 1;
  // 상승 전환 구간 — 위 경계에 임계 안으로 다가옴. 경계 가격엔 상주 호가를 두지 않고, 청산 시작 임계 안이면 매도 노출을 경계 가격 매수 지정가로 청산한다
  SPREAD_CAPTURE_ZONE_RISING = 2;
  // 하락 전환 구간 — 아래 경계에 임계 안으로 다가옴. 경계 가격엔 상주 호가를 두지 않고, 청산 시작 임계 안이면 매수 노출을 경계 가격 매도 지정가로 청산한다
  SPREAD_CAPTURE_ZONE_FALLING = 3;
}

// 살아 있는 주문 1건의 상태 — 상주 호가 또는 전환 구간 청산
enum SpreadCaptureOrderState {
  SPREAD_CAPTURE_ORDER_STATE_UNSPECIFIED = 0;
  // 송신 — 접수 대기 (08:30 전 송신분은 FEP 가 보관)
  SPREAD_CAPTURE_ORDER_STATE_SENT = 1;
  // 거래소 접수 (부분 체결 포함)
  SPREAD_CAPTURE_ORDER_STATE_LIVE = 2;
  // 정정 송신 — 다른 가격으로 옮기는 중
  SPREAD_CAPTURE_ORDER_STATE_MOVING = 3;
  // 취소 송신 — 확인 대기
  SPREAD_CAPTURE_ORDER_STATE_CANCELLING = 4;
}

// 살아 있는 주문 1건 — 상주 호가 또는 전환 구간 청산
message SpreadCaptureOrder {
  // 거래소 주문번호
  int64 order_id = 1;

  kdo.v1.common.OrderSide side = 2;

  // 지금 걸린 가격(원)
  int64 price = 3;

  int64 quantity = 4;

  int64 filled_quantity = 5;

  SpreadCaptureOrderState state = 6;

  // 정정 중이면 옮길 가격(원), 아니면 0
  int64 moving_to = 7;

  // 전환 구간 청산 주문(일반 지정가)이면 true, 상주 호가(LP)면 false
  bool flatten = 8;
}

message SpreadCaptureStatus {
  string etf_symbol = 1;

  string fund_code = 2;

  SpreadCaptureState state = 3;

  // 마지막 상태 사유
  string message = 4;

  SpreadCaptureZone zone = 5;

  // 안전 구간이면 매수 1호가(원), 전환 구간이면 경계 가격(원). 공정가 준비 전이면 0
  int64 zone_price = 6;

  // 공정가(원) = 매수 NAV + bid_adjustment. 준비 전이면 0
  double fair_bid = 7;

  // 공정가(원) = 매도 NAV + ask_adjustment. 준비 전이면 0
  double fair_ask = 8;

  // 임계를 ETF 가격으로 환산한 값(원)
  double threshold = 9;

  // 순노출 (주, 매수 +) — 오늘 이 실행의 상주·청산 체결 합
  int64 net_quantity = 10;

  // 살아 있는 주문 — 상주 호가와 전환 구간 청산 (매수 높은 가격 → 매도 낮은 가격 순)
  repeated SpreadCaptureOrder orders = 11;

  // 오늘 ETF 체결 (상주·청산 합)
  kdo.v1.lp.FillStat etf_fill = 12;

  // 청산 주문 발주 횟수 (전환 구간 청산 지정가 신규 + 마감 청산 IOC)
  int64 flatten_count = 13;

  // 청산 주문 체결 수량
  int64 flatten_quantity = 14;

  // 마지막 전환·청산 시작 때 선물 시세 수신 → 경계 주문 송신 반환까지 (µs). 아직 없으면 0
  int64 last_trigger_latency_us = 15;

  // 영업일 YYYYMMDD (KST)
  uint32 date = 16;

  google.protobuf.Timestamp started_at = 17;
}

// ========== Cycle ==========

// 사이클 이벤트 종류
enum SpreadCaptureCycleEventType {
  SPREAD_CAPTURE_CYCLE_EVENT_TYPE_UNSPECIFIED = 0;
  // 체결 — 상주 호가·전환 구간 청산·마감 청산·화면 퀵주문 (purpose 로 구분)
  SPREAD_CAPTURE_CYCLE_EVENT_TYPE_FILLED = 1;
  // 청산 신규 송신 (전환 구간 청산·마감 청산 IOC)
  SPREAD_CAPTURE_CYCLE_EVENT_TYPE_FLATTEN_SENT = 2;
  // 청산 가격 정정 송신 (from_price → price)
  SPREAD_CAPTURE_CYCLE_EVENT_TYPE_FLATTEN_AMEND_SENT = 3;
  // 청산 취소 송신
  SPREAD_CAPTURE_CYCLE_EVENT_TYPE_FLATTEN_CANCEL_SENT = 4;
  // 청산 주문 수량이 취소됨 — 보낸 취소의 확인 또는 거래소 자동취소(message 에 사유)
  SPREAD_CAPTURE_CYCLE_EVENT_TYPE_FLATTEN_CANCELLED = 5;
  // 청산 신규·정정·취소 거부 (message 에 사유)
  SPREAD_CAPTURE_CYCLE_EVENT_TYPE_FLATTEN_REJECTED = 6;
  // 안전 구간이 바뀜 (zone·zone_price 가 새 구간)
  SPREAD_CAPTURE_CYCLE_EVENT_TYPE_ZONE_CHANGED = 7;
}

// 사이클 주문의 용도
enum SpreadCaptureOrderPurpose {
  SPREAD_CAPTURE_ORDER_PURPOSE_UNSPECIFIED = 0;
  // 상주 호가
  SPREAD_CAPTURE_ORDER_PURPOSE_QUOTE = 1;
  // 전환 구간 청산
  SPREAD_CAPTURE_ORDER_PURPOSE_BOUNDARY_FLATTEN = 2;
  // 마감 청산 IOC
  SPREAD_CAPTURE_ORDER_PURPOSE_CLOSE_OUT = 3;
  // 화면 퀵주문
  SPREAD_CAPTURE_ORDER_PURPOSE_QUICK_ORDER = 4;
}

// 사이클 이벤트 — 체결·청산 주문 경과·안전 구간 변경과 그때 공정가
message SpreadCaptureCycleEvent {
  // 서버가 처리한 시각 — 이벤트는 이 순서다. 체결은 통보를 처리한 시각이라 거래소 체결(exchange_time)보다 늦다
  google.protobuf.Timestamp time = 1;

  SpreadCaptureCycleEventType type = 2;

  // 주문 용도. ZONE_CHANGED 면 UNSPECIFIED
  SpreadCaptureOrderPurpose purpose = 3;

  // 주문번호 — 정정 송신이면 정정 주문번호. ZONE_CHANGED 면 0
  int64 order_id = 4;

  // 정정 송신이면 원주문번호, 정정·취소 거부면 원주문번호. 그 밖엔 0
  int64 original_order_id = 5;

  // ZONE_CHANGED 면 UNSPECIFIED
  kdo.v1.common.OrderSide side = 6;

  // 주문·체결 가격(원). 정정 송신이면 옮길 가격. ZONE_CHANGED 면 0
  int64 price = 7;

  // 정정 전 가격(원). 정정 송신이 아니면 0
  int64 from_price = 8;

  // 주문·체결·취소 수량 (주). ZONE_CHANGED·거부면 0
  int64 quantity = 9;

  // 체결만 — make·take·단일가
  kdo.v1.order_log.LastAskBidTpCode last_ask_bid_tp_code = 10;

  // 체결만 — 거래소 체결 시각 (ms)
  google.protobuf.Timestamp exchange_time = 11;

  // 그때 알던 공정가 매수 쪽(원) — 체결은 거래소 체결 시각, 나머지는 time 기준. 모르면(선물 시세 이상·실행 종료 뒤) 없음
  optional double fair_bid = 12;

  // 그때 알던 공정가 매도 쪽(원)
  optional double fair_ask = 13;

  // 앞 이벤트 뒤 이 이벤트까지 공정가 매수 쪽 최저(원). 없으면 모름
  optional double fair_low = 14;

  // 앞 이벤트 뒤 이 이벤트까지 공정가 매도 쪽 최고(원). 없으면 모름
  optional double fair_high = 15;

  // 그때 구간. ZONE_CHANGED 면 새 구간
  SpreadCaptureZone zone = 16;

  // 안전 구간이면 매수 1호가(원), 전환 구간이면 경계 가격(원). 모르면 0
  int64 zone_price = 17;

  // 이 이벤트 뒤 순노출 (주, 매수 +)
  int64 net_quantity = 18;

  // 거부·자동취소 사유
  string message = 19;
}

// 포지션 사이클 — 순노출이 0 에서 생겨(open) 다시 0 이 될 때(close)까지. 한 체결로 방향이 뒤집히면 닫고 남은 수량으로 새 사이클을 연다.
message SpreadCaptureCycle {
  string etf_symbol = 1;

  string fund_code = 2;

  // 실행 시작 시각 — seq 와 함께 사이클을 가리킨다
  google.protobuf.Timestamp run_started_at = 3;

  // 그 실행의 몇 번째 사이클인지 (1부터)
  uint32 seq = 4;

  // 연 방향 — BID 매수 노출, ASK 매도 노출
  kdo.v1.common.OrderSide side = 5;

  // 연 체결의 거래소 시각
  google.protobuf.Timestamp opened_at = 6;

  // 순노출이 0 이 된 체결의 거래소 시각. 없으면 아직 열려 있거나 노출을 남긴 채 실행이 끝났다
  google.protobuf.Timestamp closed_at = 7;

  // 연 방향 체결 수량 합 (주)
  int64 entry_quantity = 8;

  // 연 방향 평균 체결가 (원)
  double entry_price = 9;

  // 반대 방향 체결 수량 합 (주)
  int64 exit_quantity = 10;

  // 반대 방향 평균 체결가 (원). 체결이 없으면 0
  double exit_price = 11;

  // 사이클 동안 최대 순노출 (주, 절댓값)
  int64 max_quantity = 12;

  // 실현 손익 (원, 수수료·세금 제외) — 청산한 수량 몫(평균 진입가 기준). 닫혔으면 사이클 전체 손익
  double realized_pnl = 13;

  // 사이클 동안 공정가 매수 쪽 최저(원). 없으면 모름
  optional double fair_low = 14;

  // 사이클 동안 공정가 매도 쪽 최고(원). 없으면 모름
  optional double fair_high = 15;

  // 경과 (time 순) — 첫 이벤트가 연 체결이다
  repeated SpreadCaptureCycleEvent events = 16;

  // 상한을 넘어 events 에 남기지 않은 이벤트 수 (수량·손익에는 반영된다)
  uint32 omitted_events = 17;
}

// ========== Request/Response Messages ==========

message GetSpreadCaptureRequest {
  string etf_symbol = 1 [(google.api.field_behavior) = REQUIRED];
  string fund_code = 2 [(google.api.field_behavior) = REQUIRED];
}

message ListSpreadCapturesRequest {}

message ListSpreadCapturesResponse {
  repeated SpreadCapture spread_captures = 1;
}

message UpdateSpreadCaptureRequest {
  // update_time 은 무시(서버가 채움)
  SpreadCapture spread_capture = 1 [(google.api.field_behavior) = REQUIRED];
}

message DeleteSpreadCaptureRequest {
  string etf_symbol = 1 [(google.api.field_behavior) = REQUIRED];
  string fund_code = 2 [(google.api.field_behavior) = REQUIRED];
}

message StartSpreadCaptureRequest {
  string etf_symbol = 1 [(google.api.field_behavior) = REQUIRED];
  string fund_code = 2 [(google.api.field_behavior) = REQUIRED];
}

message StopSpreadCaptureRequest {
  string etf_symbol = 1 [(google.api.field_behavior) = REQUIRED];
  string fund_code = 2 [(google.api.field_behavior) = REQUIRED];
}

message ListSpreadCaptureStatusesRequest {}

message ListSpreadCaptureStatusesResponse {
  repeated SpreadCaptureStatus statuses = 1;
}

message StreamSpreadCaptureStatusesRequest {}

message ListSpreadCaptureCyclesRequest {
  // 비우면 전체
  string etf_symbol = 1;

  // 비우면 전체
  string fund_code = 2;

  // 사이클을 연 영업일 (YYYYMMDD, KST). 미지정 시 날짜 제한 없음
  optional uint32 date = 3;

  // 페이지 크기 (기본: 20, 최대: 100)
  optional int32 page_size = 4;

  // 이전 응답의 next_page_token 을 그대로 전달. 최초 조회는 미지정
  optional string page_token = 5;
}

message ListSpreadCaptureCyclesResponse {
  repeated SpreadCaptureCycle cycles = 1;

  // 다음 페이지 토큰 (더 없으면 빈 문자열)
  string next_page_token = 2;
}
