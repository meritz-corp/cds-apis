syntax = "proto3";

package kdo.v1.stock;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/api/client.proto";

import "kdo/v1/common.proto";

option go_package = "github.com/meritz-corp/cds-apis/go/kdo/v1;kdo";

// StockService - 주식 종목 정보 서비스
service StockService {
  // 단일 주식 조회
  rpc GetStock(GetStockRequest) returns (Stock) {
    option (google.api.http) = {
      get: "/v1/{stock=stocks/*}"
    };
    option (google.api.method_signature) = "stock";
  }

  // 주식 목록 조회
  rpc ListStocks(ListStocksRequest) returns (ListStocksResponse) {
    option (google.api.http) = {
      get: "/v1/stocks"
    };
    option (google.api.method_signature) = "";
  }

  rpc GetStockTickSize(GetStockTickSizeRequest) returns (GetStockTickSizeResponse) {
    option (google.api.http) = {
      get: "/v1/stocks:tickSize"
    };
    option (google.api.method_signature) = "stock";
  }
}

// 주식 종목 정보
message Stock {
  option (google.api.resource) = {
    type: "kdo.cdsapis.xyz/Stock"
    pattern: "stocks/{stock}"
  };

  // 리소스 이름 (stocks/{code})
  string name = 1;

  // 종목 코드
  string code = 2;

  // 심볼
  string symbol = 3;

  // 시장 유형
  kdo.v1.common.MarketType market_type = 4;

  // 종목명
  string market_name = 5;

  // 전일 종가
  int64 prev_price = 6;

  // 최근 체결가
  int64 last_price = 7;

  // 상장 수량
  int64 listed_quantity = 8;

  // 거래 가능 여부
  bool tradable = 9;

  // 대차 가능 여부
  bool short_sellable = 10;

  // 틱 크기
  int64 tick_size = 11;
}

// ========== Request/Response Messages ==========

message GetStockRequest {
  // 리소스 이름 (stocks/{code})
  string stock = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "kdo.cdsapis.xyz/Stock"
    }
  ];
}

message ListStocksRequest {
  // 페이지 크기 (optional)
  optional int32 page_size = 1;

  // 페이지 토큰 (optional)
  optional string page_token = 2;

  // 필터링 조건 (optional, AIP-160)
  //
  // Available Fields (아래 3개 외 필드는 INVALID_ARGUMENT):
  // * symbol - 표준코드, 예: "KR7005930003"
  // * name   - 종목명, 예: "삼성전자"
  // * code   - 단축코드, 예: "A005930"
  //
  // NOTE: market_type / tradable / short_sellable 은 서버 미구현 — 사용 시 INVALID_ARGUMENT
  //
  // Operators:
  // * `=` 정확일치 (대소문자 구분)
  // * `:` 부분일치 (대소문자 무시)
  // * 값은 큰따옴표로 감싼다
  //
  // Combining:
  // * AND 만 지원 — OR 는 INVALID_ARGUMENT
  // * 같은 필드에 `=` 를 여러 번 주면 그 값들의 OR(IN) 으로 동작
  // * 같은 필드에 `=` 와 `:` 를 같이 주면 `=` 가 우선
  // * `symbol:"*"` 는 해당 필드 무필터 (빈 filter 와 동일)
  //
  // Examples:
  // * symbol = "KR7005930003"
  // * symbol = "KR7005930003" AND symbol = "KR7000660001"   // 둘 중 하나
  // * code = "A005930"
  // * name:"삼성"
  string filter = 3 [(google.api.field_behavior) = OPTIONAL];
}

message ListStocksResponse {
  // 주식 목록
  repeated Stock stocks = 1;

  // 다음 페이지 토큰
  string next_page_token = 2;
}


message GetStockTickSizeRequest {
  string target_price = 1 [
    (google.api.field_behavior) = REQUIRED
  ];
}


message GetStockTickSizeResponse {
  // 리소스 이름 (stocks/{code})
  int64 tick_size = 1;
}