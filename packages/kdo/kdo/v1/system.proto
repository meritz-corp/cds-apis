syntax = "proto3";

package kdo.v1.system;

import "kdo/v1/user.proto";

option go_package = "github.com/meritz-corp/cds-apis/go/kdo/v1;kdo";

// SystemService provides system-level information about the running KDO instance.
service SystemService {
  // GetServerInfo returns the identity and supported trading roles of the running KDO instance.
  rpc GetServerInfo(GetServerInfoRequest) returns (GetServerInfoResponse) {}

  // GetConnectionInfo returns current market feed and FEP connection information.
  rpc GetConnectionInfo(GetConnectionInfoRequest) returns (GetConnectionInfoResponse) {}

  // GetVersionInfo returns build-time version information of the running KDO instance.
  rpc GetVersionInfo(GetVersionInfoRequest) returns (GetVersionInfoResponse) {}

  // StopAllTrading gracefully stops all trading services
  // (mm, mm_v2, quote/etf_lp, futures_lp, pair, arbitrage, market_sniping, lead_lag, lead_lag_v2).
  rpc StopAllTrading(StopAllTradingRequest) returns (StopAllTradingResponse) {}

  // StopSymbolFund stops all trading services that are running for the given (symbol, fund) pair.
  rpc StopSymbolFund(StopSymbolFundRequest) returns (StopSymbolFundResponse) {}

  // GetCpuAffinity returns the current CPU core allocation of the running KDO instance:
  // per-core assignments, per-pool reserved vs in-use cores, roles running unpinned,
  // and instances that could not get a core.
  rpc GetCpuAffinity(GetCpuAffinityRequest) returns (GetCpuAffinityResponse) {}
}

message StopAllTradingRequest {}

message StopAllTradingResponse {}

message StopSymbolFundRequest {
  string symbol = 1;
  string fund = 2;
  string cause = 3;
}

message StopSymbolFundResponse {
  repeated StoppedService stopped = 1;
}

message StoppedService {
  string service = 1;     // "quote" | "mm" | "mm_v2" | "futures_lp" | "pair"
  string identifier = 2;  // "symbol/fund" 또는 pair_id
  string message = 3;
}

message GetConnectionInfoRequest {}

message GetVersionInfoRequest {}

message GetServerInfoRequest {}

message GetServerInfoResponse {
  // Hostname identifying the running KDO instance.
  string server_name = 1;

  // Legacy single-role field. A single-role instance returns its role here and
  // supported_roles = [role]. A wildcard instance returns ROLE_UNSPECIFIED here.
  // ROLE_UNSPECIFIED never means that every role is supported.
  kdo.v1.user.Role role = 2;

  // Trading roles supported by this instance. A wildcard (server.role = "*")
  // instance returns [ROLE_LP, ROLE_ARBITRAGE, ROLE_BROKERAGE, ROLE_LOAN].
  // Clients use this list when nonempty. If empty, clients may fall back to the
  // legacy role field, accepting only a concrete role (never ROLE_UNSPECIFIED).
  repeated kdo.v1.user.Role supported_roles = 3;
}

message GetVersionInfoResponse {
  // Full git commit hash (e.g., "33d5b91abc...")
  string git_commit_hash = 1;
}

message GetConnectionInfoResponse {
  // Market feed connection info per exchange
  MarketFeedInfo krx_market_feed = 1;
  MarketFeedInfo nxt_market_feed = 2;  // optional

  // FEP connection info
  FepInfo fep = 3;
}

// Market feed implementation info
message MarketFeedInfo {
  string implementation = 1;  // "udp", "file", "websocket", "grpc", "simulation"
}

// FEP connection info
message FepInfo {
  string implementation = 1;  // "fake_memory", "fake_tcp", "tcp"
  repeated FepClientInfo clients = 2;  // populated when implementation is "tcp"
}

// Individual FEP client connection info
message FepClientInfo {
  string market_type = 1;     // "Kospi", "Kosdaq", "Deriv"
  string exchange_type = 2;   // "Krx"
  string client_type = 3;     // "Submit", "Trade"
  string task_code = 4;       // e.g., "A831", "B851"
  string transport_type = 5;  // "tcp", "unix"
  string host = 6;            // IP address (for tcp) or empty (for unix)
  uint32 port = 7;            // port number (for tcp) or 0 (for unix)
  string path = 8;            // unix socket path (for unix) or empty (for tcp)
  string hostname = 9;        // resolved hostname/alias (e.g., "pfds11", "pfds14")
}

message GetCpuAffinityRequest {}

message GetCpuAffinityResponse {
  // Total CPU cores visible to the process.
  uint32 cpu_count = 1;

  // Cores eligible for allocation (yaml cpu_affinity.cores), ascending.
  repeated uint32 cores = 2;

  // Allocation mode: "easing" | "tightening_a" | "tightening_b" | "tightening_c" | "deep_tightening".
  string mode = 3;

  // Per-core view of every core in `cores`, including cores with nothing on them.
  repeated CpuAffinityCore core_allocations = 4;

  // Per-pool view (yaml cpu_affinity.pool): cores reserved for the pool vs cores actually in use.
  repeated CpuAffinityPool pools = 5;

  // Roles with no CPU affinity (pool: 0, or not listed in pool) — they run on the main scheduler.
  repeated string unpinned_roles = 6;

  // Instances that requested a core but got none (easing allocates 1 core per instance).
  // These cannot start until a core frees up or the pool is widened.
  repeated CpuAffinityService unassigned = 7;
}

message CpuAffinityCore {
  // CPU core id (0-indexed).
  uint32 core_id = 1;

  // Services allocated on this core. Empty means free (main scheduler).
  repeated CpuAffinityService services = 2;

  // True when this is the shared core of a tightening mode.
  bool shared_core = 3;

  // yaml pool key that reserved this core. Empty when the core is not pool-reserved.
  string pool_key = 4;
}

message CpuAffinityPool {
  // yaml pool key (etf_lp, mm, pair_v1 ...).
  string key = 1;

  // Roles covered by this key.
  repeated string roles = 2;

  // Cores reserved for this pool.
  repeated uint32 reserved_cores = 3;

  // Reserved cores that currently carry at least one instance.
  repeated uint32 used_cores = 4;
}

message CpuAffinityService {
  // Role name (QuoteLp, MarketMaking, MarketFeed, Pair, PairV2 ...).
  string role = 1;

  // Instance key: "symbol:fund" for LP/MM, pair id for pair, a thread label for single-instance roles.
  string thread = 2;

  // True when a thread actually pinned itself to the core.
  // False means the core is reserved but the thread has not started yet.
  bool pinned = 3;
}
