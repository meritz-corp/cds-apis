syntax = "proto3";

package kdo.v1.order_limit;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/client.proto";

option go_package = "github.com/meritz-corp/cds-apis/go/kdo/v1;kdo";

// OrderLimiterService는 주문 건수/수량 제한 설정 관리 및 실시간 모니터링을 제공합니다.
service OrderLimiterService {
  // 전역 OrderLimiter 설정 업데이트
  rpc UpdateOrderLimiterConfig(UpdateOrderLimiterConfigRequest) returns (UpdateOrderLimiterConfigResponse) {
    option (google.api.http) = {
      patch: "/v1/order-limiter:updateConfig"
      body: "*"
    };
  }

  // 전역 OrderLimiter 시간 프레임 현황 스트리밍
  rpc StreamOrderLimiterStatus(StreamOrderLimiterStatusRequest) returns (stream OrderLimiterStatus) {
    option (google.api.http) = {
      get: "/v1/order-limiter/status:stream"
    };
  }

  // (fund, symbol) 별 거래대금 서킷브레이커 설정 업데이트
  rpc UpdateTurnoverLimit(UpdateTurnoverLimitRequest) returns (TurnoverLimit) {
    option (google.api.http) = {
      patch: "/v1/order-limiter/turnover-limits:update"
      body: "*"
    };
  }

  // (fund, symbol) 별 거래대금 서킷브레이커 설정 조회
  rpc GetTurnoverLimit(GetTurnoverLimitRequest) returns (TurnoverLimit) {
    option (google.api.http) = {
      get: "/v1/order-limiter/turnover-limits/{symbol=*}"
    };
    option (google.api.method_signature) = "symbol,fund_code";
  }

  // 모든 거래대금 서킷브레이커 설정 목록 조회
  rpc ListTurnoverLimits(ListTurnoverLimitsRequest) returns (ListTurnoverLimitsResponse) {
    option (google.api.http) = {
      get: "/v1/order-limiter/turnover-limits"
    };
  }
}

// ============================================================================
// Messages
// ============================================================================

// 시간 프레임별 주문 제한 설정
message TimeFrameLimit {
  // 시간 윈도우 (초)
  uint32 window_seconds = 1 [(google.api.field_behavior) = REQUIRED];

  // 최대 주문 건수
  uint32 max_orders = 2 [(google.api.field_behavior) = REQUIRED];
}

// OrderLimiter 설정 (전역 싱글톤)
message OrderLimiterConfig {
  // 활성화 여부
  optional bool enabled = 1;

  reserved 2; // 삭제됨: daily_cumulative_limit

  // 단일 주문 수량 한도 (i64)
  optional int64 single_order_limit = 3;

  // 시간 프레임별 주문 건수 제한 목록
  // 설정 시 기존 목록을 전체 교체
  repeated TimeFrameLimit time_frame_limits = 4;
}

// 시간 프레임별 주문 건수 현황
message TimeFrameStatus {
  // 시간 윈도우 (초)
  uint32 window_seconds = 1;

  // 현재 윈도우 내 주문 건수
  uint32 current_count = 2;

  // 최대 주문 건수
  uint32 max_orders = 3;
}

// 전역 OrderLimiter 현황
message OrderLimiterStatus {
  reserved 1, 2, 4, 5; // 삭제됨: fund_code, etf_symbol, daily_ordered_quantity, daily_cumulative_limit

  // 활성화 여부
  bool enabled = 3;

  // 시간 프레임별 주문 건수 현황
  repeated TimeFrameStatus time_frame_statuses = 6;

  // 대상 펀드코드 (4자리 문자열)
  string fund_code = 7;
  // 대상 심볼 (ETF 또는 선물)
  string etf_symbol = 8;
}

// ============================================================================
// Request/Response Messages
// ============================================================================

// UpdateOrderLimiterConfig
message UpdateOrderLimiterConfigRequest {
  reserved 1, 2; // 삭제됨: fund_code, etf_symbol

  // 업데이트할 설정
  OrderLimiterConfig config = 3 [(google.api.field_behavior) = REQUIRED];
}

message UpdateOrderLimiterConfigResponse {
  // 업데이트된 대상 수
  uint32 updated_count = 1;

  // 메시지
  string message = 2;
}

// StreamOrderLimiterStatus
message StreamOrderLimiterStatusRequest {
  reserved 1, 2; // 삭제됨: fund_code, etf_symbol
}

// ============================================================================
// TurnoverLimit — (symbol, fund_code, window_secs) 별 N초 슬라이딩 윈도우 gross 체결금액 서킷브레이커
// ============================================================================

// 체결금액 서킷브레이커 설정.
// 키는 (symbol, fund_code, window_secs) 3-튜플 — 같은 (fund, symbol)에 여러 시간창(예: 1초/60초)
// 한도를 동시에 걸 수 있다. N초 윈도우 동안 gross 체결금액(체결가×수량, 매수+매도 합산)이
// max_amount 이상이면 해당 LP 를 정지시킨다.
message TurnoverLimit {
  // 대상 심볼. ETF/선물 심볼을 지정하면 그 종목만 집계한다.
  // 특수값 "*"(와일드카드)를 쓰면 해당 fund 의 "모든 종목 체결 합산"에 대해 한도를 걸며,
  // 초과 시 그 펀드의 활성 LP 전체가 정지된다. (심볼별 한도와 펀드 전체 한도를 동시에 둘 수 있다.)
  string symbol = 1;
  // 4자리 펀드코드
  string fund_code = 2;
  // 활성화 여부
  bool enabled = 3;
  // 슬라이딩 윈도우 (초). (symbol, fund_code)와 함께 복합키를 이루어 창별로 별도 설정된다.
  uint32 window_secs = 4;
  // 윈도우 gross 체결금액 상한 (원). 0=비활성
  int64 max_amount = 5;
}

message UpdateTurnoverLimitRequest {
  TurnoverLimit limit = 1;
}

message GetTurnoverLimitRequest {
  // 대상 심볼. 펀드 전체 한도는 "*"(와일드카드)로 조회한다.
  string symbol = 1;
  string fund_code = 2;
  // 조회할 시간창(초). 키가 (symbol, fund_code, window_secs) 이므로 창을 특정한다.
  uint32 window_secs = 3;
}

message ListTurnoverLimitsRequest {}

message ListTurnoverLimitsResponse {
  repeated TurnoverLimit limits = 1;
}
