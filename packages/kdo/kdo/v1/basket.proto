message ListBasketExecutionsRequest {
  // 부모 바스켓 (baskets/{id}). 전체 조회는 "baskets/-"
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      child_type: "kdo.cdsapis.xyz/BasketExecution"
    }
  ];

  // 페이지 크기 (optional)
  optional int32 page_size = 2;

  // 페이지 토큰 (optional)
  optional string page_token = 3;
}

message ListBasketExecutionsResponse {
  // 실행 목록 (items/order_relations 미포함)
  repeated BasketExecution executions = 1;

  // 다음 페이지 토큰
  string next_page_token = 2;
}

message SubmitBasketExecutionRoundRequest {
  // 리소스 이름 (baskets/{basket_id}/executions/{execution_id})
  string execution = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "kdo.cdsapis.xyz/BasketExecution"
    }
  ];

  // 발주할 회차 (미지정 시 current_round_no + 1)
  optional uint32 round_no = 2;
}

// 회차 발주로 제출된 주문
message BasketExecutionSubmittedOrder {
  // 실행 항목 ID
  int64 execution_item_id = 1;

  // 종목 심볼
  string symbol = 2;

  // 주문 ID
  uint64 order_id = 3;

  // 주문 방향
  kdo.v1.common.OrderSide side = 4;

  // 주문 수량
  int64 quantity = 5;

  // 주문 가격
  string price = 6;

  // 발주 회차
  uint32 round_no = 7;
}

// 발주/취소에서 건너뛴 항목
message BasketExecutionSkippedItem {
  // 실행 항목 ID
  int64 execution_item_id = 1;

  // 건너뛴 사유
  string reason = 2;
}

message SubmitBasketExecutionRoundResponse {
  // 발주된 회차
  uint32 round_no = 1;

  // 제출된 주문 목록
  repeated BasketExecutionSubmittedOrder submitted_orders = 2;

  // 건너뛴 항목 목록
  repeated BasketExecutionSkippedItem skipped_items = 3;
}

message CancelBasketExecutionResidualRequest {
  // 리소스 이름 (baskets/{basket_id}/executions/{execution_id})
  string execution = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "kdo.cdsapis.xyz/BasketExecution"
    }
  ];
}

// 취소 요청된 주문
message BasketExecutionCancelledOrder {
  // 실행 항목 ID
  int64 execution_item_id = 1;

  // 종목 심볼
  string symbol = 2;

  // 취소 주문 ID
  uint64 cancel_order_id = 3;

  // 취소 대상 원주문 ID
  uint64 original_order_id = 4;
}

message CancelBasketExecutionResidualResponse {
  // 취소 요청된 주문 목록
  repeated BasketExecutionCancelledOrder cancelled_orders = 1;

  // 건너뛴 항목 목록
  repeated BasketExecutionSkippedItem skipped_items = 2;
}

message StreamBasketExecutionRequest {
