syntax = "proto3";

package kdo.v1.basket;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/empty.proto";
import "google/api/resource.proto";
import "google/api/client.proto";
import "kdo/v1/common.proto";

option go_package = "github.com/meritz-corp/cds-apis/go/kdo/v1;kdo";

// BasketService - 바스켓 관리 서비스
service BasketService {
  // 단일 바스켓 조회
  rpc GetBasket(GetBasketRequest) returns (Basket) {
    option (google.api.http) = {
      get: "/v1/{basket=baskets/*}"
    };
    option (google.api.method_signature) = "basket";
  }

  // 바스켓 목록 조회
  rpc ListBaskets(ListBasketsRequest) returns (ListBasketsResponse) {
    option (google.api.http) = {
      get: "/v1/baskets"
    };
    option (google.api.method_signature) = "";
  }

  // 바스켓 생성
  rpc CreateBasket(CreateBasketRequest) returns (Basket) {
    option (google.api.http) = {
      post: "/v1/baskets"
      body: "basket"
    };
    option (google.api.method_signature) = "basket";
  }

  // 바스켓 수정
  rpc UpdateBasket(UpdateBasketRequest) returns (Basket) {
    option (google.api.http) = {
      patch: "/v1/{basket.name=baskets/*}"
      body: "basket"
    };
    option (google.api.method_signature) = "basket,update_mask";
  }

  // 바스켓 삭제
  rpc DeleteBasket(DeleteBasketRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/{basket=baskets/*}"
    };
    option (google.api.method_signature) = "basket";
  }

  // 바스켓 가치 조회 (현재 시세 기준)
  rpc GetBasketValue(GetBasketValueRequest) returns (BasketValue) {
    option (google.api.http) = {
      get: "/v1/{basket=baskets/*}/value"
    };
    option (google.api.method_signature) = "basket";
  }

  // ==========================================================================
  // Basket Execution - 바스켓 실행 (발주 인스턴스)
  // ==========================================================================

  // 바스켓 실행 생성 - 바스켓 구성 스냅샷 기반 실행 인스턴스 생성
  rpc CreateBasketExecution(CreateBasketExecutionRequest) returns (BasketExecution) {
    option (google.api.http) = {
      post: "/v1/{parent=baskets/*}/executions"
      body: "*"
    };
    option (google.api.method_signature) = "parent";
  }

  // 단일 실행 조회 (items + order_relations 포함)
  rpc GetBasketExecution(GetBasketExecutionRequest) returns (BasketExecution) {
    option (google.api.http) = {
      get: "/v1/{execution=baskets/*/executions/*}"
    };
    option (google.api.method_signature) = "execution";
  }

  // 실행 목록 조회 (items/order_relations 미포함)
  // parent를 "baskets/-" 로 지정하면 전체 바스켓의 실행을 조회 (AIP-159)
  rpc ListBasketExecutions(ListBasketExecutionsRequest) returns (ListBasketExecutionsResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=baskets/*}/executions"
    };
    option (google.api.method_signature) = "parent";
  }

  // 회차 발주 - 잔여 수량을 남은 회차로 분할하여 이번 회차 주문 제출
  rpc SubmitBasketExecutionRound(SubmitBasketExecutionRoundRequest) returns (SubmitBasketExecutionRoundResponse) {
    option (google.api.http) = {
      post: "/v1/{execution=baskets/*/executions/*}:submitRound"
      body: "*"
    };
  }

  // 미체결 잔량 취소 - 활성 주문 전량 취소 요청
  rpc CancelBasketExecutionResidual(CancelBasketExecutionResidualRequest) returns (CancelBasketExecutionResidualResponse) {
    option (google.api.http) = {
      post: "/v1/{execution=baskets/*/executions/*}:cancelResidual"
      body: "*"
    };
  }

  // 실행 상태 스트리밍 - 최초 1회 현재 상태 push 후 변경 시마다 push (items 포함, order_relations 미포함)
  rpc StreamBasketExecution(StreamBasketExecutionRequest) returns (stream BasketExecution) {
    option (google.api.http) = {
      get: "/v1/{execution=baskets/*/executions/*}:stream"
    };
    option (google.api.method_signature) = "execution";
  }
}

// ============================================================================
// Basket Entity
// ============================================================================

// 바스켓 - 여러 상품을 묶은 덩어리
message Basket {
  option (google.api.resource) = {
    type: "kdo.cdsapis.xyz/Basket"
    pattern: "baskets/{basket}"
  };

  // 리소스 이름 (baskets/{id})
  string name = 1;

  // 바스켓 ID
  int32 id = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // 바스켓 이름
  string display_name = 3;

  // 바스켓 타입
  BasketType basket_type = 4 [
    (google.api.field_behavior) = REQUIRED
  ];

  // 구성 종목 목록
  repeated BasketItem items = 5;

  // 실행 설정 (분할 주문, 체결률 임계값, 주문 유형 등)
  ExecutionConfig execution_config = 6;

  // 타입별 설정
  oneof type_config {
    // ETF 구성종목 설정 (basket_type이 ETF_CONSTITUENT인 경우)
    EtfConstituentConfig etf_constituent = 7;

    // 청산 설정 (basket_type이 LIQUIDATION인 경우)
    LiquidationConfig liquidation = 8;

    // 커스텀 바스켓은 추가 설정 없음
  }

  // 생성 시간
  google.protobuf.Timestamp create_time = 11 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // 수정 시간
  google.protobuf.Timestamp update_time = 12 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];
}

// 바스켓 타입
enum BasketType {
  BASKET_TYPE_UNSPECIFIED = 0;
  // ETF 구성종목 바스켓 (PDF 기반 자동 계산)
  BASKET_TYPE_ETF_CONSTITUENT = 1;
  // 청산 바스켓 (잔고 전량 청산: 롱→매도, 숏→매수)
  BASKET_TYPE_LIQUIDATION = 2;
  // 커스텀 바스켓 (수동 구성)
  BASKET_TYPE_CUSTOM = 3;
}


// ETF 구성종목 바스켓 설정
message EtfConstituentConfig {
  // ETF 심볼
  string etf_symbol = 1 [
    (google.api.field_behavior) = REQUIRED
  ];

  int64 quantity = 2;
}

// 청산 바스켓 설정
// 청산은 방향이 없음 - 롱 포지션은 매도, 숏 포지션은 매수로 자동 결정
message LiquidationConfig {
  // 청산 목표 시점 (optional)
  google.protobuf.Timestamp target_time = 1;
}

// 바스켓 구성 항목
message BasketItem {
  // 종목 심볼
  string symbol = 1 [
    (google.api.field_behavior) = REQUIRED
  ];

  // 수량 (음수 가능: 매도 포지션)
  int64 quantity = 2;

  // 가격 소스 (바스켓 가치 계산용)
  PriceSource price_source = 3;

  // 계약 승수 (선물용, 주식은 1.0)
  double multiple = 4;

  // 주문에 사용할 펀드 코드
  string fund_code = 5 [
    (google.api.field_behavior) = REQUIRED
  ];
}

// 가격 소스
enum PriceSource {
  PRICE_SOURCE_UNSPECIFIED = 0;
  // (bid1 + ask1) / 2
  PRICE_SOURCE_MID_PRICE = 1;
  // 최우선 매수호가
  PRICE_SOURCE_BID1 = 2;
  // 최우선 매도호가
  PRICE_SOURCE_ASK1 = 3;
  // 2차 매수호가
  PRICE_SOURCE_BID2 = 4;
  // 2차 매도호가
  PRICE_SOURCE_ASK2 = 5;
  // 최근 체결가
  PRICE_SOURCE_LAST_PRICE = 6;
  // 3차 매수호가
  PRICE_SOURCE_BID3 = 7;
  // 3차 매도호가
  PRICE_SOURCE_ASK3 = 8;
}

// ============================================================================
// Execution Configuration
// ============================================================================

// 실행 설정
message ExecutionConfig {
  // 분할 주문 횟수 (1 = 한 번에 전량 주문)
  uint32 rounds = 1;

  // 라운드 간 딜레이 (ms)
  uint64 round_delay_ms = 2;

  // 다음 라운드 진행을 위한 체결률 임계값 (0.0~1.0)
  double fill_threshold_pct = 3;

  // 주문 유형
  OrderType order_type = 4;

  // 심볼별 호가 설정 (optional)
  map<string, SymbolPricingConfig> pricing_configs = 5;
}

// 주문 유형
enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  // 시장가
  ORDER_TYPE_MARKET = 1;
  // 지정가 (pricing_config 기반)
  ORDER_TYPE_LIMIT = 2;
  // 공격적 지정가 (상대호가)
  ORDER_TYPE_AGGRESSIVE = 3;
}

// 심볼별 호가 설정
message SymbolPricingConfig {
  // 매수 시 사용할 가격
  PriceSource buy_price_source = 1;

  // 매도 시 사용할 가격
  PriceSource sell_price_source = 2;

  // 가격 조정 (틱 단위, +: 공격적, -: 보수적)
  int32 price_offset_ticks = 3;
}

// ============================================================================
// Basket Value
// ============================================================================

// 바스켓 가치 (현재 시세 기준)
message BasketValue {
  // 리소스 이름 (baskets/{id})
  string name = 1;

  // 바스켓 ID
  int32 id = 2;

  // 총 가치 (원)
  int64 total_value = 3;

  // 구성종목별 가치
  repeated BasketItemValue item_values = 4;

  // 계산 시간
  google.protobuf.Timestamp calculated_at = 5;
}

// 구성종목 가치
message BasketItemValue {
  // 종목 심볼
  string symbol = 1;

  // 수량
  int64 quantity = 2;

  // 사용된 가격
  string price = 3;

  // 가격 소스
  PriceSource price_source = 4;

  // 계약 승수
  double multiple = 5;

  // 종목 가치 (price * quantity * multiple)
  int64 value = 6;
}

// ============================================================================
// Request/Response Messages
// ============================================================================

message GetBasketRequest {
  // 리소스 이름 (baskets/{id})
  string basket = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "kdo.cdsapis.xyz/Basket"
    }
  ];
}

message ListBasketsRequest {
  // 페이지 크기 (optional)
  optional int32 page_size = 1;

  // 페이지 토큰 (optional, for pagination)
  optional string page_token = 2;

  // 필터링 조건 (optional, AIP-160)
  //
  // Available Fields:
  // * basket_type - 바스켓 타입 (BASKET_TYPE_ETF_CONSTITUENT, BASKET_TYPE_LIQUIDATION, BASKET_TYPE_CUSTOM)
  // * display_name - 바스켓 이름 (문자열, 부분 일치)
  // * etf_constituent.etf_symbol - ETF 심볼 (ETF_CONSTITUENT 타입인 경우)
  //
  // Operators:
  // * = : 일치
  // * != : 불일치
  // * : : 포함 (문자열 부분 일치)
  //
  // Examples:
  // * basket_type=BASKET_TYPE_ETF_CONSTITUENT
  // * basket_type!=BASKET_TYPE_CUSTOM
  // * display_name:"KODEX"
  // * etf_constituent.etf_symbol="069500"
  // * basket_type=BASKET_TYPE_ETF_CONSTITUENT AND etf_constituent.etf_symbol="069500"
  // * basket_type=BASKET_TYPE_LIQUIDATION AND display_name:"청산"
  string filter = 3 [(google.api.field_behavior) = OPTIONAL];
}

message ListBasketsResponse {
  // 바스켓 목록
  repeated Basket baskets = 1;

  // 다음 페이지 토큰
  string next_page_token = 2;
}

message CreateBasketRequest {
  // 생성할 바스켓
  Basket basket = 1 [
    (google.api.field_behavior) = REQUIRED
  ];
}

message UpdateBasketRequest {
  // 수정할 바스켓
  Basket basket = 1 [
    (google.api.field_behavior) = REQUIRED
  ];

  // 수정할 필드 마스크
  google.protobuf.FieldMask update_mask = 2;
}

message DeleteBasketRequest {
  // 리소스 이름 (baskets/{id})
  string basket = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "kdo.cdsapis.xyz/Basket"
    }
  ];
}

message GetBasketValueRequest {
  // 리소스 이름 (baskets/{id})
  string basket = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "kdo.cdsapis.xyz/Basket"
    }
  ];
}

// ============================================================================
// Basket Execution
// ============================================================================

// 바스켓 실행 - 바스켓의 1회 발주 실행 인스턴스 (생성 시점 바스켓 스냅샷 기반)
message BasketExecution {
  option (google.api.resource) = {
    type: "kdo.cdsapis.xyz/BasketExecution"
    pattern: "baskets/{basket}/executions/{execution}"
  };

  // 리소스 이름 (baskets/{basket_id}/executions/{execution_id})
  string name = 1;

  // 실행 ID
  int64 id = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // 바스켓 ID
  int32 basket_id = 3 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // 실행 생성 시점의 바스켓 이름 스냅샷
  string basket_display_name = 4 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // 실행 상태
  BasketExecutionStatus status = 5 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // 현재 회차 (0 = 미시작)
  uint32 current_round_no = 6 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // 계획 분할 회차 수
  uint32 planned_round_count = 7;

  // 집계 요약 (수량/금액 합계)
  BasketExecutionSummary summary = 8 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // 최초 발주 시간
  google.protobuf.Timestamp start_time = 9 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // 완료 시간
  google.protobuf.Timestamp end_time = 10 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // 생성 시간
  google.protobuf.Timestamp create_time = 11 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // 수정 시간
  google.protobuf.Timestamp update_time = 12 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // 구성 항목 (GetBasketExecution/StreamBasketExecution 응답에서만 채워짐)
  repeated BasketExecutionItem items = 13 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // 주문 연결 이력 (GetBasketExecution 응답에서만 채워짐)
  repeated BasketExecutionOrderRelation order_relations = 14 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];
}

// 바스켓 실행 상태
enum BasketExecutionStatus {
  BASKET_EXECUTION_STATUS_UNSPECIFIED = 0;
  // 생성됨 (미발주)
  BASKET_EXECUTION_STATUS_DRAFT = 1;
  // 예약됨
  BASKET_EXECUTION_STATUS_SCHEDULED = 2;
  // 발주 진행 중
  BASKET_EXECUTION_STATUS_RUNNING = 3;
  // 일시정지
  BASKET_EXECUTION_STATUS_PAUSED = 4;
  // 전량 체결 완료
  BASKET_EXECUTION_STATUS_COMPLETED = 5;
  // 취소됨
  BASKET_EXECUTION_STATUS_CANCELLED = 6;
  // 실패 항목 존재
  BASKET_EXECUTION_STATUS_FAILED = 7;
}

// 바스켓 실행 집계 요약
message BasketExecutionSummary {
  // 항목 수
  uint32 item_count = 1;

  // 목표 수량 합계 (절대값 합)
  int64 target_quantity_total = 2;

  // 발주 수량 합계
  int64 ordered_quantity_total = 3;

  // 체결 수량 합계
  int64 filled_quantity_total = 4;

  // 잔여 수량 합계
  int64 remaining_quantity_total = 5;

  // 체결 금액 합계 (원)
  int64 filled_amount_total = 6;

  // 전량 체결된 항목 수
  uint32 filled_item_count = 7;

  // 실패한 항목 수
  uint32 failed_item_count = 8;
}

// 바스켓 실행 구성 항목
message BasketExecutionItem {
  // 실행 항목 ID
  int64 id = 1;

  // 종목 심볼
  string symbol = 2;

  // 펀드 코드
  string fund_code = 3;

  // 목표 수량 (음수 = 매도)
  int64 target_quantity = 4;

  // 발주 수량
  int64 ordered_quantity = 5;

  // 체결 수량
  int64 filled_quantity = 6;

  // 잔여 수량
  int64 remaining_quantity = 7;

  // 평균 체결가 (체결 없으면 빈 문자열)
  string average_fill_price = 8;

  // 체결 금액 (원)
  int64 filled_amount = 9;

  // 항목 상태
  BasketExecutionItemStatus status = 10;

  // 수정 시간
  google.protobuf.Timestamp update_time = 11;
}

// 바스켓 실행 항목 상태
enum BasketExecutionItemStatus {
  BASKET_EXECUTION_ITEM_STATUS_UNSPECIFIED = 0;
  // 대기
  BASKET_EXECUTION_ITEM_STATUS_PENDING = 1;
  // 재발주 가능
  BASKET_EXECUTION_ITEM_STATUS_READY = 2;
  // 발주됨
  BASKET_EXECUTION_ITEM_STATUS_SUBMITTED = 3;
  // 일부 체결
  BASKET_EXECUTION_ITEM_STATUS_PARTIALLY_FILLED = 4;
  // 전량 체결
  BASKET_EXECUTION_ITEM_STATUS_FILLED = 5;
  // 취소됨
  BASKET_EXECUTION_ITEM_STATUS_CANCELLED = 6;
  // 실패 (주문 거부 등)
  BASKET_EXECUTION_ITEM_STATUS_FAILED = 7;
}

// 바스켓 실행 주문 연결 이력 (실행 항목 ↔ 주문 감사 추적)
message BasketExecutionOrderRelation {
  // 연결 ID
  int64 id = 1;

  // 실행 항목 ID
  int64 execution_item_id = 2;

  // 주문 ID
  uint64 order_id = 3;

  // 원주문 ID (취소/정정인 경우)
  optional uint64 original_order_id = 4;

  // 발주 회차
  uint32 round_no = 5;

  // 액션 타입
  BasketExecutionActionType action_type = 6;

  // 생성 시간
  google.protobuf.Timestamp create_time = 7;
}

// 바스켓 실행 주문 액션 타입
enum BasketExecutionActionType {
  BASKET_EXECUTION_ACTION_TYPE_UNSPECIFIED = 0;
  // 신규 주문
  BASKET_EXECUTION_ACTION_TYPE_NEW = 1;
  // 정정 주문
  BASKET_EXECUTION_ACTION_TYPE_AMEND = 2;
  // 취소 주문
  BASKET_EXECUTION_ACTION_TYPE_CANCEL = 3;
}

// ============================================================================
// Basket Execution Request/Response Messages
// ============================================================================

message CreateBasketExecutionRequest {
  // 부모 바스켓 (baskets/{id})
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      child_type: "kdo.cdsapis.xyz/BasketExecution"
    }
  ];

  // 계획 분할 회차 수 (미지정 시 바스켓 execution_config.rounds, 그것도 없으면 1)
  optional uint32 planned_round_count = 2;
}

message GetBasketExecutionRequest {
  // 리소스 이름 (baskets/{basket_id}/executions/{execution_id})
  string execution = 1 [
